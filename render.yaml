# Render Blueprint for the FastAPI backend. Not yet validated by an actual Render deploy.
services:
  - type: web
    name: agrichain-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL        # Neon connection string, set in the Render dashboard
        sync: false
      - key: JWT_SECRET          # generated by Render
        generateValue: true
      - key: CORS_ORIGINS        # your Vercel URL, e.g. https://agrichain.vercel.app
        sync: false
